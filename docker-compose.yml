services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nossa_conta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nossa_conta_dev}
      POSTGRES_DB: ${POSTGRES_DB:-nossa_conta}
    ports:
      # Porta do host configurável: a 5432 costuma estar ocupada por outro projeto.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nossa_conta} -d ${POSTGRES_DB:-nossa_conta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nossa_conta}:${POSTGRES_PASSWORD:-nossa_conta_dev}@db:5432/${POSTGRES_DB:-nossa_conta}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 3000
      IMPORT_STORAGE_DIR: ${IMPORT_STORAGE_DIR:-./storage/imports}
      IMPORT_RETENTION_DAYS: ${IMPORT_RETENTION_DAYS:-7}
      IMPORT_MAX_FILE_SIZE_MB: ${IMPORT_MAX_FILE_SIZE_MB:-5}
      IMPORT_MAX_FILES_PER_REQUEST: ${IMPORT_MAX_FILES_PER_REQUEST:-10}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./shared:/app/shared
      # Arquivos de importação sobrevivem a reinícios, separado do bind mount de código.
      - dados_importacoes:/app/backend/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./shared:/app/shared

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    profiles: ["ferramentas"]

volumes:
  dados_postgres:
  dados_importacoes:
